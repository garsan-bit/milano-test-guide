<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FBF3E4">
<title>Saluti da Milano</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    color-scheme: light;
    --paper: #FBF3E4; --sand: #F3E3C3; --ink: #1F3B4D; --ink-soft: #4F6573;
    --red: #D1432F; --green: #2E7D4F; --mustard: #B77A0B; --sea: #3E8F8A;
    --orange: #D9772B; --pink: #C4577A; --purple: #6B4E9B; --you: #1a73e8;
    --serif: Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.5; padding-bottom: env(safe-area-inset-bottom); }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Kopf ---------- */
  .hero-wrap { border-bottom: 3px solid var(--ink); padding-top: env(safe-area-inset-top); background: var(--paper); }
  .hero-art { display: block; width: 100%; max-width: 720px; height: auto; margin: 0 auto; }

  /* ---------- Ansicht + Filter ---------- */
  .bar { position: sticky; top: 0; z-index: 1200; background: color-mix(in srgb, var(--paper) 95%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 2px solid var(--ink); }
  .viewbar { max-width: 640px; margin: 0 auto; padding: 10px 16px 0; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; border: 2px solid var(--ink); background: #fff; }
  .seg button { min-height: 44px; border: 0; background: transparent; color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .seg button + button { border-left: 2px solid var(--ink); }
  .seg button svg { width: 18px; height: 18px; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .chips { max-width: 640px; margin: 0 auto; display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px 12px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 2px solid var(--ink); border-radius: 999px; background: #fff; color: var(--ink); font: inherit; font-size: 15px; cursor: pointer; }
  .chip .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--dot, var(--ink)); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .chip[aria-pressed="true"] .dot { box-shadow: 0 0 0 2px var(--paper); }

  /* ---------- Lust auf ...? ---------- */
  .ask-title { font-family: var(--serif); font-weight: 700; font-size: 28px; line-height: 1.15; margin: 8px 4px 12px; }
  .asks { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 4px; }
  .ask-btn { min-height: 44px; padding: 0 16px; border: 2px solid var(--red); border-radius: 999px; background: var(--sand); color: var(--red); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
  .ask-btn[aria-pressed="true"] { background: var(--red); color: #fff; }
  .bubble { position: relative; margin: 18px 0 24px; padding: 16px 18px; background: #fff; border: 2px solid var(--ink); font-family: var(--serif); font-size: 19px; line-height: 1.45; }
  .bubble::before, .bubble::after { content: ""; position: absolute; left: 28px; border: 11px solid transparent; }
  .bubble::before { bottom: -24px; border-top-color: var(--ink); }
  .bubble::after { bottom: -20px; border-top-color: #fff; }
  .bubble small { display: block; margin-top: 8px; font-family: var(--sans); font-size: 13px; color: var(--ink-soft); }

  /* ---------- Liste ---------- */
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 40px; }
  .rule { border: 0; border-top: 2px dashed var(--ink); margin: 28px 0 0; opacity: .35; }
  .group-title { font-family: var(--serif); font-weight: 700; font-size: 28px; line-height: 1.15; margin: 36px 4px 4px; }
  .group-intro { margin: 0 4px 16px; color: var(--ink-soft); font-size: 15px; }
  .card { --accent: var(--ink); background: #fff; border: 2px solid var(--ink); border-left: 10px solid var(--accent); padding: 16px 16px 14px; margin-bottom: 14px; }
  .card[data-cat="sight"] { --accent: var(--ink); } .card[data-cat="food"] { --accent: var(--orange); }
  .card[data-cat="sweet"] { --accent: var(--pink); } .card[data-cat="gelato"] { --accent: var(--green); }
  .card[data-cat="coffee"] { --accent: var(--red); } .card[data-cat="art"] { --accent: var(--purple); }
  .card[data-cat="market"] { --accent: var(--mustard); } .card[data-cat="trip"] { --accent: var(--sea); }
  .card h3 { margin: 0; font-family: var(--serif); font-weight: 700; font-size: 23px; line-height: 1.2; }
  .meta { margin: 4px 0 0; font-size: 14px; color: var(--ink-soft); }
  .dist { font-weight: 700; color: var(--ink); }
  .note { margin: 10px 0 0; max-width: 60ch; }
  .quote { margin: 12px 0 0; padding-left: 14px; border-left: 3px solid var(--red); font-family: var(--serif); font-size: 17px; line-height: 1.4; }
  .pill { display: inline-block; margin-top: 12px; margin-right: 6px; font-size: 14px; font-weight: 600; padding: 3px 10px; border: 1.5px solid var(--ink); background: var(--sand); }
  .pill.open { background: #CFE6D3; }
  .picks { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; padding: 0; list-style: none; }
  .picks li { font-size: 14px; padding: 3px 10px; border: 1.5px solid var(--accent); background: color-mix(in srgb, var(--accent) 12%, #fff); }
  .shot { display: block; width: 100%; height: auto; margin-top: 12px; border: 2px solid var(--ink); }
  .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 14px; border: 2px solid var(--ink); border-radius: 0; font: inherit; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer; background: transparent; color: var(--ink); }
  .btn.primary { background: var(--red); border-color: var(--red); color: #fff; flex: 1 1 150px; }
  .btn.ghost { flex: 1 1 100px; }
  .btn svg { width: 18px; height: 18px; flex: none; }
  .btn.sm { min-height: 40px; flex: none; }
  .card.featured { background: var(--ink); color: var(--paper); border-color: var(--ink); border-left-color: var(--red); padding: 20px 18px 18px; }
  .card.featured h3 { font-size: 30px; }
  .card.featured .meta, .card.featured .dist { color: var(--paper); }
  .card.featured .meta { opacity: .8; }
  .card.featured .btn.ghost { color: var(--paper); border-color: var(--paper); }
  .hint { margin: 0 0 14px; padding: 14px 16px; background: var(--sand); border: 2px dashed var(--ink); }
  .hint b { font-family: var(--serif); font-size: 19px; }
  .hint p { margin: 6px 0 0; }
  .empty { padding: 24px 16px; color: var(--ink-soft); }
  footer { max-width: 640px; margin: 0 auto; padding: 8px 24px 48px; color: var(--ink-soft); font-size: 14px; }
  footer p { margin: 0; max-width: 40ch; }

  /* ---------- Karte ---------- */
  body.is-map .hero-wrap, body.is-map main, body.is-map footer { display: none; }
  .mapwrap { position: relative; height: calc(100vh - var(--bar-h, 130px)); height: calc(100dvh - var(--bar-h, 130px)); background: var(--sand); }
  #map { position: absolute; inset: 0; }
  .leaflet-container { font-family: var(--sans); background: var(--sand); }
  .leaflet-tile-pane { filter: sepia(.35) saturate(.9); }
  .mapask { position: absolute; top: 10px; left: 10px; right: 70px; z-index: 1000; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .mapask::-webkit-scrollbar { display: none; }
  .mapask .ask-btn { flex: 0 0 auto; background: var(--paper); box-shadow: 0 1px 4px rgba(0,0,0,.25); }
  .mapask .ask-btn[aria-pressed="true"] { background: var(--red); }
  .pin { width: 100%; height: 100%; display: grid; place-items: center; border-radius: 50%; border: 3px solid var(--paper); box-shadow: 0 2px 6px rgba(0,0,0,.4); font-size: 17px; line-height: 1; color: #fff; background: var(--ink); transition: transform .15s ease; }
  .pin[data-cat="food"] { background: var(--orange); } .pin[data-cat="sweet"] { background: var(--pink); }
  .pin[data-cat="gelato"] { background: var(--green); } .pin[data-cat="coffee"] { background: var(--red); }
  .pin[data-cat="art"] { background: var(--purple); } .pin[data-cat="market"] { background: var(--mustard); }
  .pin[data-cat="trip"] { background: var(--sea); }
  .pin.big { font-size: 21px; }
  .pin.sel { transform: scale(1.25); box-shadow: 0 0 0 3px var(--red), 0 3px 10px rgba(0,0,0,.4); }
  .you { width: 100%; height: 100%; border-radius: 50%; background: var(--you); border: 3px solid #fff; animation: pulse 2s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(26,115,232,.5); } 100% { box-shadow: 0 0 0 16px rgba(26,115,232,0); } }
  @media (prefers-reduced-motion: reduce) { .you { animation: none; } html { scroll-behavior: auto; } .pin { transition: none; } }
  .locate { position: absolute; top: 10px; right: 10px; z-index: 1000; width: 48px; height: 48px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); display: grid; place-items: center; cursor: pointer; }
  .locate svg { width: 24px; height: 24px; }
  .locate.on, .locate[aria-busy="true"] { color: var(--you); }
  .sheet { position: absolute; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 1000; max-width: 520px; margin: 0 auto; max-height: 62%; overflow-y: auto; background: #fff; border: 2px solid var(--ink); padding: 14px 16px; box-shadow: 4px 4px 0 var(--ink); }
  .sheet h3 { margin: 0; padding-right: 40px; font-family: var(--serif); font-weight: 700; font-size: 21px; line-height: 1.2; }
  .sheet .actions { margin-top: 10px; }
  .sheet .msg { margin: 0 0 12px; padding: 10px 12px; padding-right: 44px; background: var(--sand); border: 2px solid var(--ink); font-family: var(--serif); font-size: 16px; line-height: 1.4; }
  .sheet .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1.5px dashed rgba(31,59,77,.4); }
  .sheet .row:first-of-type { border-top: 0; }
  .sheet .row span { font-weight: 600; }
  .sheet-close { position: absolute; top: 4px; right: 4px; width: 44px; height: 44px; border: 0; background: transparent; color: var(--ink); font-size: 28px; line-height: 1; cursor: pointer; }
  .toast { position: absolute; left: 12px; right: 12px; top: 64px; z-index: 1000; max-width: 380px; margin: 0 auto; padding: 10px 14px; background: var(--ink); color: var(--paper); font-size: 14px; }
</style>
</head>
<body>

 width="8" height="12" fill="#FBF3E4" stroke="#1F3B4D" stroke-width="1.2"/><rect x="133" y="144" width="8" height="12" fill="#FBF3E4" stroke="#1F3B4D" stroke-width="1.2"/><rect x="150" y="142" width="36" height="28" fill="#2E7D4F" stroke="#1F3B4D" stroke-width="1.5"/><rect x="150" y="142" width="36" height="5" fill="#1F3B4D"/><rect x="186" y="150" width="46" height="20" fill="#D1432F" stroke="#1F3B4D" stroke-width="1.5"/><rect x="186" y="150" width="46" height="5" fill="#1F3B4D"/><rect x="232" y="152" width="44" height="18" fill="#7CB7B2" stroke="#1F3B4D" stroke-width="1.5"/><rect x="232" y="152" width="44" height="5" fill="#1F3B4D"/><rect x="276" y="150" width="40" height="20" fill="#E9B44C" stroke="#1F3B4D" stroke-width="1.5"/><rect x="276" y="150" width="40" height="5" fill="#1F3B4D"/><rect x="316" y="152" width="44" height="18" fill="#F3E3C3" stroke="#1F3B4D" stroke-width="1.5"/><rect x="316" y="152" width="44" height="5" fill="#1F3B4D"/><rect y="170" width="360" height="38" fill="#7CB7B2"/><rect y="168" width="360" height="3" fill="#1F3B4D"/><g fill="none" stroke="#FBF3E4" stroke-width="2"><path d="M6 178q8-4 16 0t16 0t16 0"/><path d="M110 181q8-4 16 0t16 0t16 0"/><path d="M230 178q8-4 16 0t16 0t16 0"/><path d="M300 184q8-4 16 0t16 0t16 0"/><path d="M40 198q8-4 16 0t16 0t16 0"/><path d="M200 196q8-4 16 0t16 0t16 0"/></g><path d="M130 190h74l-10 13h-54z" fill="#1F3B4D"/><rect x="136" y="190" width="62" height="3" fill="#E9B44C"/><rect y="207" width="360" height="1" fill="#1F3B4D"/><rect y="208" width="120" height="22" fill="#2E7D4F"/><rect x="120" y="208" width="120" height="22" fill="#fff"/><rect x="240" y="208" width="120" height="22" fill="#D1432F"/></svg>
</header>

<nav class="bar" id="bar" aria-label="Ansicht und Kategorien">
  <div class="viewbar">
    <div class="seg" role="group" aria-label="Ansicht">
      <button type="button" data-view="list" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Liste
      </button>
      <button type="button" data-view="map" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>Karte
      </button>
    </div>
  </div>
  <div class="chips" id="filters"></div>
</nav>

<section class="mapwrap" id="mapwrap" hidden aria-label="Karte mit allen Spots">

  <div class="mapask" id="mapask"></div>

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>

<main id="main">
  <section id="ask" aria-live="polite"></section>

  <div id="list"></div>

<footer>
  <p>Von eurem Trauzeugen. Gute Reise und viel Spaß in Mailand!</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  /* ============================================================
     INHALT
     Orte:   cats = Kategorien (die erste ist die Hauptkategorie), lat/lng für die Karte,
             dest = Ziel der Navigation, link = Originallink aus Google Maps,
             img = optionales Bild (Dateiname oder Webadresse), price = optionaler Preis
     Fragen: spots = Liste von Orts-IDs, msg = Nachricht
     ============================================================ */

  const CATEGORIES = {
    all:    { label: "Alle" },
    sight:  { label: "Sehenswert", color: "var(--ink)",     icon: "🏛️" },
    food:   { label: "Essen",      color: "var(--orange)",  icon: "🥪" },
    sweet:  { label: "Süßes",      color: "var(--pink)",    icon: "🥐" },
    gelato: { label: "Gelato",     color: "var(--green)",   icon: "🍨" },
    coffee: { label: "Kaffee",     color: "var(--red)",     icon: "☕" },
    art:    { label: "Kunst",      color: "var(--purple)",  icon: "🎨" },
    market: { label: "Markt",      color: "var(--mustard)", icon: "🛍️" },
    trip:   { label: "Ausflug",    color: "var(--sea)",     icon: "🚆" }
  };

  const GROUPS = [
    { id: "sight",  title: "Sehenswert", intro: "" },
    { id: "food",   title: "Essen und Snacks", intro: "" },
    { id: "sweet",  title: "Süßes", intro: "Pistazien-Croissants, für die ihr ein bisschen Platz lassen solltet." },
    { id: "gelato", title: "Gelato", intro: "Gelato gibt es an jeder Ecke, und alle waren sehr gut. Das sind unsere Stammplätze." },
    { id: "coffee", title: "Kaffee", intro: "" },
    { id: "art",    title: "Kunst", intro: "" },
    { id: "market", title: "Markt", intro: "" },
    { id: "trip",   title: "Ausflug nach Como", intro: "" }
  ];

  const HINT = { title: "Bootstour auf dem Lago di Como",

  /* ============================================================
     Hilfsfunktionen
     ============================================================ */

  const $ = id => document.getElementById(id);
  const ICON_NAV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M3 11 21 3l-8 18-2-8-8-2z"/></svg>';
  const ICON_PIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>';
  const ICON_MAP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>';

  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
  const idx = id => PLACES.findIndex(p => p.id === id);
  const routeUrl = p => "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(p.dest) + "&travelmode=" + (p.mode || "walking");
  const detailUrl = p => p.link || "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(p.dest);

  function meters(a, b) {
    const R = 6371000, rad = x => x * Math.PI / 180;
    const h = Math.sin(rad(b.lat - a.lat) / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(rad(b.lng - a.lng) / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }

  function distText(p) {
    if (!user) return "";
    const d = meters(user, p);
    const km = (d / 1000).toFixed(d < 10000 ? 1 : 0).replace(".", ",");
    const txt = d < 950 ? (Math.max(10, Math.round(d / 10) * 10) + " m") : (km + " km");
    const walk = d < 3000 ? " · ca. " + Math.max(1, Math.round(d / 80)) + " Min. zu Fuß" : "";
    return '<span class="dist">' + txt + "</span>" + walk;
  }

  function milanNow() {
    const parts = new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Rome", weekday: "short", hour: "numeric", hour12: false }).formatToParts(new Date());
    const wd = parts.find(x => x.type === "weekday").value;
    const hour = parseInt(parts.find(x => x.type === "hour").value, 10) % 24;
    return { day: ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(wd), hour };
  }

  function statusBadge(p) {
    if (p.openDay === undefined) return "";
    const { day, hour } = milanNow();
    const open = day === p.openDay && hour >= p.openFrom && hour < p.openTo;
    return open ? '<span class="pill open">Heute geöffnet, bis ' + p.openTo + " Uhr</span>" : '<span class="pill">Heute geschlossen, nur dienstags</span>';
  }

  /* ============================================================
     Zustand
     ============================================================ */

  let active = "all", view = "list", askId = null, selected = null, user = null;
  let map = null, markerLayer = null, userMarker = null, userCircle = null;
  const markers = [];
  let watchId = null, lastRenderPos = null, toastTimer = null;

  const visible = () => PLACES.map((p, i) => i).filter(i => active === "all" || PLACES[i].cats.includes(active));
  const askObj = () => PROMPTS.find(a => a.id === askId);

  /* ============================================================
     Liste und "Lust auf ...?"
     ============================================================ */

  function cardHtml(p, i) {
    const picks = p.picks ? '<ul class="picks" aria-label="Empfohlene Sorten">' + p.picks.map(x => "<li>" + x + "</li>").join("") + "</ul>" : "";
    const quote = p.quote ? '<blockquote class="quote">' + p.quote + "</blockquote>" : "";
    const price = p.price ? '<span class="pill">' + p.price + "</span>" : "";
    const img = p.img ? '<img class="shot" src="' + esc(p.img) + '" alt="' + esc(p.name) + '" loading="lazy">' : "";
    const d = distText(p);
    return (
      '<article class="card' + (p.featured ? " featured" : "") + '" data-cat="' + p.cats[0] + '">' +
        "<h3>" + p.name + "</h3>" +
        '<p class="meta">' + p.meta + (d ? " · " + d : "") + "</p>" +
        '<p class="note">' + p.note + "</p>" + picks + quote + img + (price || statusBadge(p) ? "<div>" + price + statusBadge(p) + "</div>" : "") +
        '<div class="actions">' +
          '<a class="btn primary" href="' + routeUrl(p) + '" target="_blank" rel="noopener">' + ICON_NAV + "Route starten</a>" +
          '<button class="btn ghost" type="button" data-focus="' + i + '">' + ICON_MAP + "Auf Karte</button>" +
          '<a class="btn ghost" href="' + detailUrl(p) + '" target="_blank" rel="noopener">' + ICON_PIN + "In Maps</a>" +
        "</div></article>"
    );
  }

  const hintHtml = () => '<aside class="hint"><b>' + HINT.title + "</b><p>" + HINT.text + "</p></aside>";

  function groupHtml(g, ids) {
    if (!ids.length) return "";
    if (user) ids = ids.slice().sort((a, b) => meters(user, PLACES[a]) - meters(user, PLACES[b]));
    return '<h2 class="group-title">' + g.title + "</h2>" + (g.intro ? '<p class="group-intro">' + g.intro + "</p>" : "") +
      ids.map(i => cardHtml(PLACES[i], i)).join("") + (g.id === "trip" ? hintHtml() : "");
  }

  function renderList() {
    let html = "";
    if (active === "all") {
      GROUPS.forEach(g => { html += groupHtml(g, PLACES.map((p, i) => i).filter(i => PLACES[i].cats[0] === g.id)); });
    } else {
      html = groupHtml(GROUPS.find(g => g.id === active), visible());
    }
    $("list").innerHTML = html || '<p class="empty">Hier gibt es noch keine Tipps.</p>';
    if (user) lastRenderPos = { lat: user.lat, lng: user.lng };
  }

  const askChips = () => PROMPTS.map(a => '<button class="ask-btn" type="button" data-ask="' + a.id + '" aria-pressed="' + (a.id === askId) + '">' + a.label + "</button>").join("");

  function renderAsk() {
    const a = askObj();
    $("ask").innerHTML =
      '<h2 class="ask-title">Gerade Lust auf …?</h2><div class="asks">' + askChips() + "</div>" +
      (a ? '<div class="bubble">' + a.msg + "<small>Tipp von eurem Trauzeugen</small></div>" + a.spots.map(id => cardHtml(PLACES[idx(id)], idx(id))).join("") : "");
    $("mapask").innerHTML = askChips();
  }

  function setAsk(id) {
    askId = askId === id ? null : id;
    renderAsk();
    if (view === "map") { askId ? goAsk() : select(null); }
  }

  document.addEventListener("click", e => {
    const a = e.target.closest("[data-ask]");
    if (a) { setAsk(a.dataset.ask); return; }
    const f = e.target.closest("[data-focus]");
    if (f) showView("map", Number(f.dataset.focus));
  });

  /* ============================================================
     Filter
     ============================================================ */

  function renderFilters() {
    const box = $("filters");
    const used = new Set(PLACES.flatMap(p => p.cats));
    box.innerHTML = Object.entries(CATEGORIES).filter(([k]) => k === "all" || used.has(k)).map(([k, c]) =>
      '<button class="chip" type="button" data-k="' + k + '" aria-pressed="' + (k === active) + '"' + (c.color ? ' style="--dot:' + c.color + '"' : "") + ">" +
      (c.color ? '<span class="dot"></span>' : "") + c.label + "</button>").join("");
    box.querySelectorAll(".chip").forEach(btn => btn.addEventListener("click", () => {
      active = btn.dataset.k;
      box.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", b === btn));
      renderList();
      if (view === "map") {
        if (selected !== null && !visible().includes(selected)) select(null);
        syncMarkers(); fitVisible();
      } else {
        const bar = $("bar");
        if (window.scrollY > bar.offsetTop) window.scrollTo({ top: bar.offsetTop });
      }
    }));
  }

  /* ============================================================
     Karte
     ============================================================ */

  function initMap() {
    if (map) return true;
    if (typeof L === "undefined") {
      $("map").innerHTML = '<p class="empty">Die Karte braucht eine Internetverbindung. Bitte verbinde dich und lade die Seite neu.</p>';
      return false;
    }
    map = L.map("map", { zoomControl: false }).setView([45.4642, 9.19], 14);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(map);
    markerLayer = L.layerGroup().addTo(map);
    PLACES.forEach((p, i) => {
      const size = p.featured ? 46 : 38;
      const icon = L.divIcon({ className: "", iconSize: [size, size], iconAnchor: [size / 2, size / 2],
        html: '<div class="pin' + (p.featured ? " big" : "") + '" data-cat="' + p.cats[0] + '">' + CATEGORIES[p.cats[0]].icon + "</div>" });
      const m = L.marker([p.lat, p.lng], { icon, title: p.name, alt: p.name, zIndexOffset: p.featured ? 100 : 0 });
      m.on("click", () => select(i, true));
      markers[i] = m;
    });
    map.on("click", () => select(null));
    return true;
  }

  function syncMarkers() {
    if (!map) return;
    markerLayer.clearLayers();
    visible().forEach(i => markerLayer.addLayer(markers[i]));
    if (selected !== null) markEl(selected, true);
  }

  function fitIds(ids, maxZoom) {
    if (!map || !ids.length) return;
    if (ids.length === 1) map.setView([PLACES[ids[0]].lat, PLACES[ids[0]].lng], maxZoom || 15);
    else map.fitBounds(L.latLngBounds(ids.map(i => [PLACES[i].lat, PLACES[i].lng])), { padding: [56, 56], maxZoom: maxZoom || 16 });
  }

  function fitVisible() {
    let ids = visible();
    if (active === "all") { const local = ids.filter(i => !PLACES[i].cats.includes("trip")); if (local.length) ids = local; }
    fitIds(ids);
  }

  function markEl(i, on) {
    const el = markers[i] && markers[i].getElement();
    const pin = el && el.querySelector(".pin");
    if (pin) pin.classList.toggle("sel", on);
  }

  function select(i, pan) {
    if (selected !== null) markEl(selected, false);
    selected = i;
    if (i !== null) markEl(i, true);
    renderSheet();
    if (i !== null && pan && map) map.panTo([PLACES[i].lat, PLACES[i].lng]);
  }

  function goAsk() {
    const a = askObj(); if (!a || !map) return;
    const ids = a.spots.map(idx);
    if (ids.some(i => !visible().includes(i))) { active = "all"; renderFilters(); renderList(); }
    syncMarkers();
    if (ids.length === 1) { select(ids[0]); map.setView([PLACES[ids[0]].lat, PLACES[ids[0]].lng], 17); }
    else { select(null); fitIds(ids, 15); }
  }

  function renderSheet() {
    const a = askObj(), sheet = $("sheet");
    const inAsk = a && (selected === null || a.spots.includes(PLACES[selected].id));
    if (selected === null && !a) { sheet.hidden = true; return; }
    let h = '<button class="sheet-close" type="button" aria-label="Schließen" data-close>&times;</button>';
    if (inAsk) h += '<p class="msg">' + a.msg + "</p>";
    if (selected !== null) {
      const p = PLACES[selected], d = distText(p);
      h += "<h3>" + p.name + "</h3>" + '<p class="meta">' + p.meta + (d ? " · " + d : "") + "</p>" + statusBadge(p) +
        '<div class="actions"><a class="btn primary" href="' + routeUrl(p) + '" target="_blank" rel="noopener">' + ICON_NAV + "Route starten</a>" +
        '<a class="btn ghost" href="' + detailUrl(p) + '" target="_blank" rel="noopener">' + ICON_PIN + "In Maps</a></div>";
    } else {
      h += a.spots.map(id => {
        const p = PLACES[idx(id)], d = distText(p);
        return '<div class="row"><span>' + p.name + (d ? '<br><small class="meta">' + d + "</small>" : "") + "</span>" +
          '<a class="btn primary sm" href="' + routeUrl(p) + '" target="_blank" rel="noopener">' + ICON_NAV + "Route</a></div>";
      }).join("");
    }
    sheet.innerHTML = h;
    sheet.hidden = false;
  }

  $("sheet").addEventListener("click", e => {
    if (!e.target.closest("[data-close]")) return;
    askId = null; renderAsk(); select(null);
  });

  function toast(msg, ms) {
    const t = $("toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, ms || 4500);
  }

  /* ---------- Standort ---------- */

  function nearestVisible() {
    let best = null, bd = Infinity;
    visible().forEach(i => { const d = meters(user, PLACES[i]); if (d < bd) { bd = d; best = i; } });
    return best === null ? null : { i: best, d: bd };
  }

  function showUserOnMap(recenter) {
    if (!map || !user) return;
    const ll = [user.lat, user.lng];
    if (!userMarker) {
      userMarker = L.marker(ll, { icon: L.divIcon({ className: "", html: '<div class="you"></div>', iconSize: [22, 22], iconAnchor: [11, 11] }), interactive: false, keyboard: false, zIndexOffset: 1000 }).addTo(map);
      userCircle = L.circle(ll, { radius: user.acc || 30, weight: 1, color: "#1a73e8", fillOpacity: .08, interactive: false }).addTo(map);
    } else { userMarker.setLatLng(ll); userCircle.setLatLng(ll).setRadius(user.acc || 30); }
    if (recenter) {
      const n = nearestVisible();
      if (n && n.d < 30000) map.fitBounds(L.latLngBounds([ll, [PLACES[n.i].lat, PLACES[n.i].lng]]), { padding: [70, 70], maxZoom: 16 });
      else if (n) toast("Du bist etwa " + Math.round(n.d / 1000) + " km von den Spots entfernt. Die Karte bleibt bei Mailand.");
    }
  }

  function onPosition(pos) {
    const first = !user;
    user = { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy };
    $("locate").setAttribute("aria-busy", "false");
    $("locate").classList.add("on");
    showUserOnMap(first);
    renderSheet();
    if (first || !lastRenderPos || meters(lastRenderPos, user) > 50) { renderList(); renderAsk(); }
  }

  function onPositionError(err) {
    $("locate").setAttribute("aria-busy", "false");
    if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    toast(err && err.code === 1 ? "Standortzugriff ist nicht erlaubt. Erlaube ihn in den Browser-Einstellungen." : "Der Standort konnte nicht ermittelt werden.", 6000);
  }

  $("locate").addEventListener("click", () => {
    if (!navigator.geolocation) { toast("Dieses Gerät unterstützt keine Standortabfrage."); return; }
    if (watchId !== null && user) { showUserOnMap(true); return; }
    $("locate").setAttribute("aria-busy", "true");
    toast("Standort wird gesucht …", 3000);
    watchId = navigator.geolocation.watchPosition(onPosition, onPositionError, { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 });
  });

  /* ============================================================
     Ansicht wechseln
     ============================================================ */

  const setBarHeight = () => document.documentElement.style.setProperty("--bar-h", $("bar").offsetHeight + "px");

  function showView(v, focusIndex) {
    view = v;
    document.body.classList.toggle("is-map", v === "map");
    document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === v));
    $("mapwrap").hidden = v !== "map";
    window.scrollTo(0, 0);
    if (v !== "map" || !initMap()) return;
    setBarHeight();
    requestAnimationFrame(() => {
      map.invalidateSize();
      if (focusIndex !== undefined) {
        if (!visible().includes(focusIndex)) { active = "all"; renderFilters(); renderList(); }
        syncMarkers();
        map.setView([PLACES[focusIndex].lat, PLACES[focusIndex].lng], 16);
        select(focusIndex);
      } else if (askId) { goAsk(); }
      else { syncMarkers(); fitVisible(); renderSheet(); }
      if (user) showUserOnMap(false);
    });
  }

  document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => showView(b.dataset.view)));
  window.addEventListener("resize", () => { if (view === "map" && map) { setBarHeight(); map.invalidateSize(); } });

  renderFilters();
  renderAsk();
  renderList();
</script>
</body>
</html>
